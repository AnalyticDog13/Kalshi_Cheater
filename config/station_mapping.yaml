# =============================================================================
# Station Mapping
# Maps each Kalshi weather series ticker to its NWS settlement station.
#
# CRITICAL: These coordinates feed directly into the ensemble probability
# engine. A wrong lat/lon = wrong forecast = losing trades.
#
# How to verify: GET /series/{ticker} on Kalshi API, read settlement_sources.
# The station_id field must match the Kalshi settlement_sources station.
# Run `python -m scripts.validate_stations` to check all of these on startup.
# =============================================================================

stations:
  KXHIGHNY:
    station_id: "KNYC"          # Central Park, New York — NWS CLI station verified
    latitude: 40.78333
    longitude: -73.96667
    city: "New York"
    state: "NY"
    timezone: "America/New_York"
    notes: "Urban canyon location — GFS sometimes runs 1-2F warm in summer due to UHI"

  KXHIGHCHI:
    station_id: "KMDW"          # Chicago Midway Airport — confirmed from Kalshi settlement text
    latitude: 41.78417
    longitude: -87.75528
    city: "Chicago"
    state: "IL"
    timezone: "America/Chicago"
    notes: "Lake effect can cause rapid temperature swings; watch ensemble spread. Kalshi uses Midway (KMDW), NOT O'Hare (KORD)."

  KXHIGHLAX:
    station_id: "KLAX"          # Los Angeles International Airport — confirmed from Kalshi settlement text
    latitude: 33.93806
    longitude: -118.38889
    city: "Los Angeles"
    state: "CA"
    timezone: "America/Los_Angeles"
    notes: "Marine layer influence; ECMWF typically better than GFS for coastal CA"

  KXHIGHDC:
    station_id: "KDCA"          # Washington Reagan National Airport — NWS CLI station verified
    latitude: 38.84833
    longitude: -77.03417
    city: "Washington DC"
    state: "DC"
    timezone: "America/New_York"
    notes: "River location creates micro-climate; warmer than surrounding suburbs"

  KXHIGHHOU:
    station_id: "KHOU"          # Houston Hobby Airport — NWS CLI for Houston uses Hobby, NOT Bush (KIAH)
    latitude: 29.6375
    longitude: -95.2825
    city: "Houston"
    state: "TX"
    timezone: "America/Chicago"
    notes: "CRITICAL: NWS Daily CLI for Houston is issued from Hobby Airport (KHOU), not Bush Intercontinental (KIAH). Using KIAH would forecast the wrong location."

  KXHIGHMIA:
    station_id: "KMIA"          # Miami International Airport — NWS CLI station verified
    latitude: 25.79056
    longitude: -80.31639
    city: "Miami"
    state: "FL"
    timezone: "America/New_York"
    notes: "Sea breeze dominant; afternoon convection common in summer"

  KXHIGHDEN:
    station_id: "KDEN"          # Denver International Airport — NWS CLI station verified
    latitude: 39.84658
    longitude: -104.65622
    city: "Denver"
    state: "CO"
    timezone: "America/Denver"
    notes: "Elevation 5430ft; chinook winds can cause rapid 20-30F temperature swings"

  KXHIGHPHX:
    station_id: "KPHX"          # Phoenix Sky Harbor International Airport — NWS CLI station verified
    latitude: 33.42780
    longitude: -112.00347
    city: "Phoenix"
    state: "AZ"
    timezone: "America/Phoenix"
    notes: "Monsoon season (Jul-Sep) increases ensemble spread significantly"

  KXHIGHSEA:
    station_id: "KSEA"          # Seattle-Tacoma International Airport — NWS CLI station verified
    latitude: 47.44472
    longitude: -122.31361
    city: "Seattle"
    state: "WA"
    timezone: "America/Los_Angeles"
    notes: "Marine influence; ECMWF significantly better than GFS for Pacific coast"

  KXHIGHATL:
    station_id: "KATL"          # Hartsfield-Jackson Atlanta International Airport — NWS CLI station verified
    latitude: 33.64028
    longitude: -84.42694
    city: "Atlanta"
    state: "GA"
    timezone: "America/New_York"
    notes: "Urban heat island effect; afternoon convection common May-Sep"
