# =============================================================================
# Station Mapping
# Maps each Kalshi weather series ticker to its NWS settlement station.
#
# CRITICAL: These coordinates feed directly into the ensemble probability
# engine. A wrong lat/lon = wrong forecast = losing trades.
#
# How to verify: GET /series/{ticker} on Kalshi API, read settlement_sources.
# The station_id field must match the Kalshi settlement_sources station.
# Run `python -m scripts.validate_stations` to check all of these on startup.
# =============================================================================

stations:
  KXHIGHNY:
    station_id: "KNYC"          # Central Park, New York
    latitude: 40.7789
    longitude: -73.9692
    city: "New York"
    state: "NY"
    timezone: "America/New_York"
    notes: "Urban canyon location — GFS sometimes runs 1-2F warm in summer due to UHI"

  KXHIGHCHI:
    station_id: "KORD"          # O'Hare International Airport, Chicago
    latitude: 41.9742
    longitude: -87.9073
    city: "Chicago"
    state: "IL"
    timezone: "America/Chicago"
    notes: "Lake effect can cause rapid temperature swings; watch ensemble spread"

  KXHIGHLAX:
    station_id: "KCQT"          # Downtown LA / USC campus
    latitude: 34.0236
    longitude: -118.2912
    city: "Los Angeles"
    state: "CA"
    timezone: "America/Los_Angeles"
    notes: "Marine layer influence; ECMWF typically better than GFS for coastal CA"

  KXHIGHDC:
    station_id: "KDCA"          # Reagan National Airport
    latitude: 38.8512
    longitude: -77.0402
    city: "Washington DC"
    state: "DC"
    timezone: "America/New_York"
    notes: "River location creates micro-climate; warmer than surrounding suburbs"

  KXHIGHHOU:
    station_id: "KIAH"          # George Bush Intercontinental Airport
    latitude: 29.9844
    longitude: -95.3414
    city: "Houston"
    state: "TX"
    timezone: "America/Chicago"
    notes: "Verify against Kalshi settlement_sources — may use KHOU (Hobby) instead"

  KXHIGHMIA:
    station_id: "KMIA"          # Miami International Airport
    latitude: 25.7959
    longitude: -80.2870
    city: "Miami"
    state: "FL"
    timezone: "America/New_York"
    notes: "Sea breeze dominant; afternoon convection common in summer"

  KXHIGHDEN:
    station_id: "KDEN"          # Denver International Airport
    latitude: 39.8561
    longitude: -104.6737
    city: "Denver"
    state: "CO"
    timezone: "America/Denver"
    notes: "Elevation 5430ft; chinook winds can cause rapid 20-30F temperature swings"

  KXHIGHPHX:
    station_id: "KPHX"          # Phoenix Sky Harbor International Airport
    latitude: 33.4373
    longitude: -112.0078
    city: "Phoenix"
    state: "AZ"
    timezone: "America/Phoenix"
    notes: "Monsoon season (Jul-Sep) increases ensemble spread significantly"

  KXHIGHSEA:
    station_id: "KSEA"          # Seattle-Tacoma International Airport
    latitude: 47.4502
    longitude: -122.3088
    city: "Seattle"
    state: "WA"
    timezone: "America/Los_Angeles"
    notes: "Marine influence; ECMWF significantly better than GFS for Pacific coast"

  KXHIGHATL:
    station_id: "KATL"          # Hartsfield-Jackson Atlanta International Airport
    latitude: 33.6407
    longitude: -84.4277
    city: "Atlanta"
    state: "GA"
    timezone: "America/New_York"
    notes: "Urban heat island effect; afternoon convection common May-Sep"
